[package]
name = "controller-gamebar"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
obfstr = { workspace = true }
nalgebra = { workspace = true }

serde = { version = "1.0.178", features = ["derive"] }
serde_json = "1.0.104"
serde_yaml = "0.9.25"

cs2 = { path = "../cs2" }
cs2-schema-provider-impl = { path = "../cs2-schema/provider-impl" }
cs2-schema-generated = { path = "../cs2-schema/generated" }
cs2-schema-cutl = { path = "../cs2-schema/cutl" }
utils-state = { path = "../utils/state" }

# Use the overlay-server from the overlay project
overlay-server = { path = "../../overlay/rust-overlay-server" }

tokio = { version = "1.36.0", features = ["full"] }
clap = { version = "4.3.19", features = ["derive"] }

